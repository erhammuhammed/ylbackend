server.servlet.context-path=/myapp

spring.datasource.url=jdbc:sqlserver://yourleague.database.windows.net:1433;database=yourleaguedb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
